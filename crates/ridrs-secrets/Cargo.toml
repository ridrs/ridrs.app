[package]
name = "ridrs-secrets"
version = "0.1.0"
description = "ridrs: storage.secrets without prompts (ADR 0053): an encrypted app file on the desktop, the Keystore-backed store on Android"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"
publish = false

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde_json = "1"

# The encrypted file (ADR 0053): AES-256-GCM, its key derived from the machine id with HKDF.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
aes-gcm = "0.10.3"
hkdf = "0.12.4"
sha2 = "0.10.9"
machine-uid = "0.6.0"

[target.'cfg(target_os = "ios")'.dependencies]
keyring-core = "1.0.1"
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }

[target.'cfg(target_os = "android")'.dependencies]
keyring-core = "1.0.1"
android-native-keyring-store = "1.0.0"
