# SPDX-License-Identifier: AGPL-3.0-or-later

[package]
name = "ridrs-media"
version = "0.1.0"
description = "ridrs: large media on the device (storage.media), resumable downloads (data.fetch) and ZIP extraction (data.archive) for the native app"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same reqwest and TLS stack as tauri-plugin-http: no second one in the app.
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "http2", "stream"] }
futures-util = "0.3.34"
tokio = { version = "1.54.1", features = ["fs", "io-util", "rt"] }
# ZIP64 and deflate (flate2 on zlib-rs); the packages of the video sources (docs/ideas/video-sources.md).
# Pinned: the newest release older than two weeks (ADR 0067).
# Range requests of the ridrs-media:// scheme (protocol.rs); the version Tauri itself uses.
http-range = "0.1.6"
zip = { version = "=9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["fs", "io-util", "rt", "macros", "rt-multi-thread"] }
