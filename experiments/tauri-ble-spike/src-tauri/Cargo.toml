# SPDX-License-Identifier: AGPL-3.0-or-later

[package]
name = "ridrs-tauri-ble-spike"
version = "0.0.1"
description = "ridrs spike: Tauri 2 + native BLE"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows.
name = "ridrs_tauri_ble_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-blec = "0.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
uuid = "1"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
keepawake = "0.6.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
