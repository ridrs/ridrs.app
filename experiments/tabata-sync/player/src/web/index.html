<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tabata Sync</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside class="library">
      <h1 id="app-title"></h1>
      <ul id="tracks" class="tracks"></ul>
    </aside>
    <main class="player">
      <header class="now">
        <div id="track-title" class="track-title"></div>
        <div id="track-meta" class="track-meta"></div>
      </header>

      <section class="state" aria-live="polite">
        <div id="phase" class="phase"></div>
        <div id="countdown" class="countdown"></div>
        <div id="detail" class="detail"></div>
      </section>

      <section class="timeline-wrap">
        <div id="timeline" class="timeline" role="slider" tabindex="0">
          <div id="blocks" class="blocks"></div>
          <div id="playhead" class="playhead"></div>
        </div>
        <div class="progress"><div id="progress-fill" class="progress-fill"></div></div>
      </section>

      <footer class="transport">
        <button id="play" class="play" type="button" disabled></button>
        <span id="clock" class="clock">0:00 / 0:00</span>
        <button id="edit" class="edit" type="button" aria-pressed="false" disabled></button>
        <label class="speed"><span id="speed-label"></span>
          <select id="speed">
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
          </select>
        </label>
      </footer>
      <section id="editor" class="editor" hidden>
        <div class="editor-row">
          <button class="mark" data-mark="work" type="button"><span></span> <kbd>W</kbd></button>
          <button class="mark" data-mark="recovery" type="button"><span></span> <kbd>R</kbd></button>
          <button class="mark" data-mark="cooldown" type="button"><span></span> <kbd>E</kbd></button>
          <span class="spacer"></span>
          <span id="editor-status" class="editor-status" aria-live="polite"></span>
          <button id="reset" class="quiet" type="button"></button>
          <button id="discard" class="quiet" type="button"></button>
          <button id="save" class="primary" type="button"></button>
        </div>
        <p id="mark-hint" class="hint"></p>
        <form id="grid" class="grid">
          <strong id="grid-title"></strong>
          <label><span id="grid-start"></span> <input name="start" type="number" step="0.1" min="0" value="10" /> s</label>
          <label><span id="grid-work"></span> <input name="work" type="number" step="0.1" min="1" value="20" /> s</label>
          <label><span id="grid-recovery"></span> <input name="recovery" type="number" step="0.1" min="0" value="10" /> s</label>
          <label><span id="grid-rounds"></span> <input name="rounds" type="number" step="1" min="1" value="8" /></label>
          <button id="grid-apply" type="submit"></button>
        </form>
        <ol id="boundaries" class="boundaries"></ol>
      </section>
      <audio id="audio" preload="auto"></audio>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
