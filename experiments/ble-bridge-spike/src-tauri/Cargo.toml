# SPDX-License-Identifier: AGPL-3.0-or-later

[package]
name = "ridrs-ble-bridge-spike"
version = "0.0.1"
description = "ridrs spike: companion WebSocket bridge + mDNS discovery"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows.
name = "ridrs_ble_bridge_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt"] }
tokio-tungstenite = "0.30.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
mdns-sd = "0.21.7"
if-addrs = "0.15.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
