<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ridrs companion</title>
    <style>
      html, body, #companion { margin: 0; min-height: 100%; }
      html, body { overscroll-behavior: none; }
      img { -webkit-user-drag: none; }
      body {
        font-family: system-ui, sans-serif;
        background: #101418;
        color: #f4f6f8;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        cursor: default;
      }
      input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
      /* Native controls show the arrow, not the web link hand; this wins over plugin styles too. */
      button, a, label, select, summary, [role="button"], [role="link"], [role="tab"] { cursor: default !important; }
      button, input, select { font: inherit; }
      button:focus-visible { outline: 3px solid #5aa9e6; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="companion"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
