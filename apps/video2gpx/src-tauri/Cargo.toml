[package]
name = "video2gpx"
version = "0.1.0"
description = "Road video without GPS in, GPX with matching timestamps out (beta)"
edition = "2021"
rust-version = "1.88"
publish = false
license = "AGPL-3.0-or-later"

[lib]
name = "video2gpx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
flate2 = "1"
libc = "0.2"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# Size first (PACKAGING.md). `panic = "abort"` is deliberately not set: a panic in one worker thread (media server, readers of
# a child process) must not end the app while a pipeline job runs (docs/DECISIONS.md E6).
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = true
