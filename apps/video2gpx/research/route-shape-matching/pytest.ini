[pytest]
testpaths = tests
pythonpath = .
# T1 (the image analysis on the clips of test-data/clips/, minutes) and T3 (the whole pipeline on test-data/long/, 15-25 min) run only when asked:
# scripts/heavy.sh .venv/bin/python -m pytest -m clips   (or -m long)
addopts = -m "not clips and not long"
markers =
    realdata: needs road-reconstruction routes and the FR_* GPX files outside the repository (skipped when absent)
    clips: T1 of docs/CONCEPT_test_strategy.md, the clips of rsm/bench/clip_set.json through motion and rotation (deselected by default)
    long: T3 of docs/CONCEPT_test_strategy.md, the whole pipeline on the long videos of rsm/bench/long_set.json (deselected by default)
