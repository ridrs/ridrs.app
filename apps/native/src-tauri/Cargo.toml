[package]
name = "ridrs-native"
version = "0.1.0"
description = "ridrs native app: Tauri 2 shell with native BLE"
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows.
name = "ridrs_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
# Direct dependency on purpose: Tauri finds a plugin's Android part only via direct dependencies.
tauri-plugin-blec = "0.18.0"
# Recordings and FIT exports in the app container (plugins/storage-files-tauri); the JS side
# is @tauri-apps/plugin-fs of the same version.
tauri-plugin-fs = "2.7.1"
# intervals.icu (ADR 0049): HTTP from Rust, the system browser and the loopback redirect.
tauri-plugin-http = "2.8.3"
tauri-plugin-opener = "2.7.2"
tauri-plugin-oauth = "2.1.0"
# The relay of ridrs (ADR 0079): sign-in and links come back as `ridrs://` deep links, and the mailbox's
# socket runs in Rust, so the webview's CSP stays closed.
tauri-plugin-deep-link = "2.4"
tauri-plugin-websocket = "2.4"
ridrs-ble = { path = "../../../crates/ridrs-ble" }
ridrs-bridge = { path = "../../../crates/ridrs-bridge" }
# storage.secrets without prompts (ADR 0053): an encrypted app file, the Keystore on Android.
ridrs-secrets = { path = "../../../crates/ridrs-secrets" }
# storage.media, data.fetch and data.archive for the video rides (docs/ideas/video-sources.md).
ridrs-media = { path = "../../../crates/ridrs-media" }
serde = { version = "1", features = ["derive"] }
# `tauri::generate_context!` reads the plugin section of tauri.conf.json (deep links) with it.
serde_json = "1"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
keepawake = "0.6.1"
# Window size and position survive a restart (desktop only).
tauri-plugin-window-state = "2.5.0"

# The debug bridge's screenshot (src/debug_snapshot.rs): the native snapshot of the WKWebView, in
# debug builds on the Mac only. The versions are the ones Tauri already uses.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData", "NSDictionary", "NSError", "NSValue", "block2"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Indications on Android (ADR 0052): a copy of tauri-plugin-blec 0.18.0 that enables them for a
# characteristic that only indicates (the FTMS control point), until upstream does.
[patch.crates-io]
tauri-plugin-blec = { path = "../../../crates/vendor/tauri-plugin-blec" }
